name: Build Windows trial apps
'on':
  push:
    branches: [mining-pc19-deneme-20261007]
    paths:
      - 'PRL_PC19_DENEME/native-src/**'
      - '.github/workflows/prl-windows-trial.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install pinned build dependencies
        run: python -m pip install -r PRL_PC19_DENEME/native-src/requirements-native.txt
      - name: Build and smoke-check Windows apps
        run: python PRL_PC19_DENEME/native-src/build_windows.py
      - name: Keep downloadable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Trial-Packs
          path: PRL_PC19_DENEME/Windows/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested packs to this branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PRL_PC19_DENEME/Windows
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Publish smoke-tested Windows trial packages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:${{ github.ref_name }}
